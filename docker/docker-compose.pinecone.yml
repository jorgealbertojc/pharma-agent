services:
  pinecone-index-1:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    container_name: pinecone-index-1
    platform: linux/amd64

    environment:
      PORT: 5081
      INDEX_TYPE: serverless
      VECTOR_TYPE: dense
      DIMENSION: 768
      METRIC: cosine

    ports:
      - "5081:5081"

    restart: unless-stopped

  pinecone-index-2:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    container_name: pinecone-index-2
    platform: linux/amd64

    environment:
      PORT: 5082
      INDEX_TYPE: serverless
      VECTOR_TYPE: dense
      DIMENSION: 768
      METRIC: cosine

    ports:
      - "5082:5082"

    restart: unless-stopped
