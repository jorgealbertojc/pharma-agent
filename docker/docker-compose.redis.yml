services:
  redis:
    image: redis:7-alpine
    container_name: redis-rag-lab
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec --save 3600 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  webdis:
    image: nicolas/webdis:latest
    container_name: webdis-rag-lab
    restart: unless-stopped
    ports:
      - "7379:7379"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
