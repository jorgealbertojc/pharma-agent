[project]
name = "pharma-agent"
version = "0.0.1"
description = "AI-powered pharmacy assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.57.0",
    "gspread>=6.2.1",
    "langchain-anthropic>=1.5.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.2",
    "langchain-pinecone>=0.2.13",
    "langgraph>=0.6.0",
    "pinecone>=7.3.0",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.workspace]
members = ["."]
